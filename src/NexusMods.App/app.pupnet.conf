# PUPNET DEPLOY: 1.6.0

# PupNet automatically finds this file https://github.com/kuiperzone/PupNet-Deploy?tab=readme-ov-file#introduction-
# if it is in the current working directory.

# Reference Config: https://raw.githubusercontent.com/kuiperzone/PupNet-HelloWorld/main/HelloWorld.pupnet.conf

# APP PREAMBLE
AppBaseName = NMAcommunity.App
AppFriendlyName = NMA Community Edition
AppId = com.nmacommunity.app
AppVersionRelease = 1.2.0[1]
AppShortSummary = Community fork of the Nexus Mods App.
AppDescription = """
    NMA Community Edition is a community fork of the Nexus Mods App, a mod manager for your games with native support for Linux.
"""
AppLicenseId =  GPL-3.0-only
AppLicenseFile =
AppChangeFile =

# PUBLISHER
PublisherName = NMA Community
PublisherCopyright = Copyright (C) Nexus Mods 2024, NMA Community 2026
PublisherLinkName = Home Page
PublisherLinkUrl = https://github.com/RoLuNeo080521/NMA-CommunityEdition
PublisherEmail =

# DESKTOP INTEGRATION
DesktopNoDisplay = false
DesktopTerminal = false
DesktopFile = com.nmacommunity.app.desktop
MetaFile = com.nmacommunity.app.metainfo.xml
IconFiles = """
    icon.ico
    icon.svg
"""

# DOTNET PUBLISH
DotnetProjectPath =
DotnetPublishArgs = -p:Version=${APP_VERSION} --self-contained true -c Release -p:TieredCompilation=true -p:PublishReadyToRun=true -p:PublishSingleFile=true
DotnetPostPublish =
DotnetPostPublishOnWindows =

# PACKAGE OUTPUT
PackageName = NMAcommunity.App
OutputDirectory = Deploy/OUT

# APPIMAGE OPTIONS
AppImageArgs = --no-appstream
AppImageVersionOutput = false

# WINDOWS SETUP OPTIONS
SetupAdminInstall = false
SetupCommandPrompt =
SetupMinWindowsVersion = 10
SetupSignTool =
SetupSuffixOutput =
SetupVersionOutput = false
SetupUninstallScript = "uninstall.bat"







# unused but required
FlatpakPlatformRuntime = org.freedesktop.Platform
FlatpakPlatformSdk = org.freedesktop.Sdk
FlatpakPlatformVersion = 23.08
