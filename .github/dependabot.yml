version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    labels:
      - "area-dependencies"
    allow:
      - dependency-name: "System.*"
      - dependency-name: "Microsoft.*"
      - dependency-name: "NexusMods.*"
      - dependency-name: "Avalonia*"
      - dependency-name: "GameFinder*"
    ignore:
      # NOTE(erri120): "special" dependencies that are tied to the roslyn compiler version
      - dependency-name: "Microsoft.CodeAnalysis.CSharp*"
    groups:
      System:
        patterns:
          - "System.*"
      Microsoft:
        patterns:
          - "Microsoft.*"
      NexusMods:
        patterns:
          - "NexusMods.*"
      Avalonia:
        patterns:
          - "Avalonia*"
      GameFinder:
        patterns:
          - "GameFinder*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    labels:
      - "area-dependencies"
    groups:
      GitHubActions:
        patterns:
          - "*"
