name: "Report a bug"
description: "Use this form to report a bug"
type: "Bug"
labels:
  - "user raised"
body:
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "What version of the app did you use?"
      placeholder: "e.g. 1.2.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "Which operating system are you using?"
      options:
        - Linux
        - Steam Deck
    validations:
      required: true
  - type: textarea
    id: log-files
    attributes:
      label: "Attach Log Files"
      description: >-
        Please attach your logs. They are in
        `~/.local/state/NMAcommunity.App/Logs/`: attach the files starting
        with `nmacommunity.app.main.` and `nmacommunity.app.slim.`.
    validations:
      required: true
