name: Report a missing game
description: 'Use this form to report when the app fails to locate a supported game. '
title: 'Game Not Found'
type: "Bug"
labels:
  - 'game support'
  - user raised
body:
  - type: markdown
    attributes:
      value: >-
        NMA Community Edition supports a limited number of games and Linux
        launchers.


        ## [See all supported games and launchers
        here](https://github.com/RoLuNeo080521/NMA-CommunityEdition#supported-games)


        Check out [the
        roadmap](https://github.com/RoLuNeo080521/NMA-CommunityEdition#roadmap)
        to see what may come next.
  - type: checkboxes
    id: confirm-supported
    attributes:
      label: Supported Game Check
      description: >-
        I confirm that I have checked the [supported
        games](https://github.com/RoLuNeo080521/NMA-CommunityEdition#supported-games), and the
        game I am reporting is listed as supported but has not been found by the
        app.
      options:
        - label: 'Yes'
          required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: >-
        Which supported game did the app fail to find?
        **If your game is not listed, it isn't supported yet.**
      options:
        - Cyberpunk 2077
        - Stardew Valley
        - Skyrim Special Edition
        - Fallout 4
        - Baldur's Gate 3
        - "Mount & Blade II: Bannerlord"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you playing on?
      options:
        - Linux
        - Steam Deck
    validations:
      required: true
  - type: input
    id: linux-distro
    attributes:
      label: Linux Distribution
      description: >-
        If you are using Linux, please specify your distribution (e.g. Ubuntu,
        Fedora, Arch).
      placeholder: e.g. Ubuntu 22.04
  - type: dropdown
    id: store
    attributes:
      label: Game Launcher
      description: Which game store/launcher is the game installed with?
      options:
        - Steam
        - Heroic Games Launcher (GOG)
        - Heroic Games Launcher (Epic Games)
        - Lutris
        - GOG Galaxy (Wine prefix)
        - Epic Games Launcher (Wine prefix)
        # - Rockstar Games Launcher
        # - Amazon Games
        # - Ubisoft Connect
        # - EA Play
        # - WeGame
        - Manually Installed
        # - Other
    validations:
      required: true
  - type: textarea
    id: log-files
    attributes:
      label: Attach Log Files
      description: >-
        Please attach your logs. They are in
        `~/.local/state/NMAcommunity.App/Logs/`: attach the files starting
        with `nmacommunity.app.main.` and `nmacommunity.app.slim.`.
    validations:
      required: true
