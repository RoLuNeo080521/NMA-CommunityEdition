name: Tests

# Runs the test suite on Linux, without the tests that need network access or are known to be flaky.

on:
  push:
    branches: [ "**" ]
    paths:
      - ".github/workflows/tests.yml"
      - "src/**"
      - "tests/**"
      - "extern/**"
      - "**.props"
      - "**.targets"
      - "**.sln"
      - "global.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Every test project copies all its dependencies into its bin/: hard-link them so the build fits on the runner disk.
  CreateHardLinksForCopyLocalIfPossible: "true"
  CreateHardLinksForCopyFilesToOutputDirectoryIfPossible: "true"
  CreateHardLinksForAdditionalFilesIfPossible: "true"
  CreateHardLinksForCopyAdditionalFilesIfPossible: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Disk space (start)
        run: df -h

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Disk space (after build)
        run: df -h

      - name: Test
        run: dotnet test --configuration Release --no-build --filter "RequiresNetworking!=True&FlakeyTest!=True" --blame-hang-timeout 20m

      - name: Disk space (end)
        if: always()
        run: df -h
