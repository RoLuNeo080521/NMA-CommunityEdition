# NMA Community Edition: automatic triggers disabled (manual run only). The fork does
# not publish NuGet packages, and this daily job packs the whole solution, which is heavy on runner disk.
name: Validate NuGet packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Setup .NET 9.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Pack
        run: dotnet pack

      - name: Validate
        shell: pwsh
        run: ./scripts/validate-nupkgs.ps1
