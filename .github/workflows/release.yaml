name: Release
run-name: Release ${{ inputs.version }}

# Builds the AppImage for the given version and publishes it as a GitHub release.
# The release notes must be committed beforehand as .github/release-notes/<version>.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, with a lowercase v (eg: 'v1.2.0')"
        required: true
        type: string
      target:
        description: "The git ref to base the release on (eg: '1957a8e7', default: current head of the branch the workflow is run on)"
        required: false
        type: string
      draft:
        description: "Create a draft release?"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Create a prerelease?"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      AppVersion: ${{ steps.validate.outputs.appVersion }}
      TargetSha: ${{ steps.validate.outputs.targetSha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target || github.sha }}

      - name: Validate version and release notes
        id: validate
        env:
          Version: ${{ inputs.version }}
        run: |
          # Versions 1.1.0 and older of the app only strip a lowercase "v" before parsing the tag as a version.
          if [[ ! "$Version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like v1.2.0 (lowercase v), got '$Version'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$Version" >/dev/null; then
            echo "::error::The tag $Version already exists"
            exit 1
          fi
          if [[ ! -s ".github/release-notes/$Version.md" ]]; then
            echo "::error::Missing release notes: .github/release-notes/$Version.md"
            exit 1
          fi
          echo "appVersion=${Version#v}" >> "$GITHUB_OUTPUT"
          echo "targetSha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [ prepare ]
    uses: ./.github/workflows/build-appimage.yml
    with:
      AppVersion: ${{ needs.prepare.outputs.AppVersion }}
      Target: ${{ needs.prepare.outputs.TargetSha }}

  release-github:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.TargetSha }}

      - name: Get AppImage
        uses: actions/download-artifact@v7
        with:
          name: nma-appimage
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: NMA Community Edition ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ needs.prepare.outputs.TargetSha }}
          body_path: .github/release-notes/${{ inputs.version }}.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*.AppImage
          fail_on_unmatched_files: true
