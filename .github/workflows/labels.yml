# Creates the labels that the issue forms, Dependabot and the workflows use, from .github/labels.json.
# Existing labels get the color and description of the file.
name: "Sync labels"

on:
  push:
    branches: [ main ]
    paths: [ ".github/labels.json" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create or update the labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            gh label create "$(jq -r .name <<< "$label")" \
              --color "$(jq -r .color <<< "$label")" \
              --description "$(jq -r .description <<< "$label")" \
              --force
          done
