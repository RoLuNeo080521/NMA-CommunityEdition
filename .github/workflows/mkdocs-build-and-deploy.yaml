# NMA Community Edition: automatic triggers disabled (manual run only). It deploys
# to GitHub Pages through the upstream Nexus-Mods/NexusMods.App.Meta workflow; re-enable once GitHub Pages is
# configured for the fork.
name: MkDocs build and deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: Nexus-Mods/NexusMods.App.Meta/.github/workflows/mkdocs-build-and-deploy.yaml@main
