# NMA Community Edition: automatic triggers disabled (manual run only). It would
# publish the NexusMods.* packages to nuget.org with the upstream NUGET_KEY secret on every v* tag (including the
# tags created by release.yaml). The fork does not publish to NuGet.
name: Publish NuGet Packages

on:
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Get version
        id: get-version
        shell: pwsh
        run: |
          $version = [System.Version]::Parse("${{ github.ref_name }}".Replace('v', '')).ToString()
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo $version

  publish:
    needs: get-version
    uses: Nexus-Mods/NexusMods.App.Meta/.github/workflows/publish-nuget-packages.yaml@main
    with:
      version: ${{ needs.get-version.outputs.version }}
      use-nuget: true
      use-github: false
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
