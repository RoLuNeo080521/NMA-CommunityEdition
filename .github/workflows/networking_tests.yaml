# NMA Community Edition: automatic triggers disabled (manual run only). Runs on a
# self-hosted runner and needs NEXUS_API_KEY + the 'test' environment, none of which exist on the fork,
# so every push left a job queued with no runner.
name: Networking Tests

on:
  workflow_dispatch:

jobs:
  build:
    
    name: Test Networking
    runs-on: [self-hosted]
    
    environment: test
    
    env:
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
          lfs: true

      - name: Print debug info
        run: dotnet --info

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Tests
        run: dotnet test --no-build --logger "GitHubActions" --filter "RequiresNetworking=True" --blame-hang-timeout 20m



